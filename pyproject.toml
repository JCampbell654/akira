[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "project-akira"
version = "0.1.0.dev0"
description = "Fast, differentiable strong gravitational lens modelling"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Project Akira contributors" },
]
dependencies = [
  "jax>=0.4.30",
  "numpy>=1.26",
  "scipy>=1.15",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/akira"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
